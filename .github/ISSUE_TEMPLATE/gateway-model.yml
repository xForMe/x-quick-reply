name: 模型或网关问题
description: 报告生成服务、百炼决策或本地网关的配置与请求问题
title: "[网关] "
body:
  - type: dropdown
    id: stage
    attributes:
      label: 失败阶段
      options:
        - 网关启动
        - 健康检查
        - 生成请求
        - 百炼决策请求
        - 浏览器连接网关
        - 不确定
    validations:
      required: true

  - type: input
    id: status
    attributes:
      label: HTTP 状态码
      placeholder: 例如 401、403、429；没有则填写无

  - type: textarea
    id: message
    attributes:
      label: 完整脱敏错误
      description: 请保留失败阶段和状态码，删除密钥、响应中的敏感内容和完整请求正文
    validations:
      required: true

  - type: textarea
    id: config
    attributes:
      label: 配置项状态
      description: 只说明哪些配置项已填写，不要粘贴配置值或密钥
      placeholder: |
        LLM_BASE_URL：已填写
        LLM_MODEL：已填写
        LLM_API_KEY：已填写
        百炼配置：已填写

  - type: textarea
    id: prototype
    attributes:
      label: 相关原型
      description: 提供涉及的高保真 HTML 原型路径或可访问链接；若不涉及用户可见界面，填写“不适用”并说明原因
      placeholder: |
        路径/链接：doc/<需求标识>/原型/index.html
        评审状态：待评审
    validations:
      required: true

  - type: textarea
    id: technical
    attributes:
      label: 技术方案
      description: 提供技术方案路径或可访问链接，并说明失败阶段、协议/配置边界、停止条件、验证方式和待验证事项；Issue 用于讨论，完整方案仍以技术.md 为基线
      placeholder: |
        路径/链接：doc/<需求标识>/技术.md
        方案摘要：
        待验证事项：
        评审状态：待评审
    validations:
      required: true

  - type: checkboxes
    id: safety
    attributes:
      label: 提交前确认
      options:
        - label: 我已删除 API 密钥、Cookie、私信正文和完整模型响应
          required: true
        - label: 我没有通过更换模型、服务商或凭据来绕过当前错误
          required: true
