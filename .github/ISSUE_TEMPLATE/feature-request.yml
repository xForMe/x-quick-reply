name: 功能请求
description: 提议快速回复插件的新功能或改进
title: "[功能] "
body:
  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题
      description: 当前遇到什么限制，谁会受到影响
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 建议方案
      description: 请描述希望插件如何工作，可以附使用示例
    validations:
      required: true

  - type: textarea
    id: scope
    attributes:
      label: 使用场景与边界
      description: 说明适用的 X 页面、输入内容和不应触发的情况

  - type: textarea
    id: acceptance
    attributes:
      label: 验收标准
      description: 写出可以明确判断完成与否的条件
      placeholder: |
        - [ ] ……
        - [ ] ……
    validations:
      required: true

  - type: checkboxes
    id: safety
    attributes:
      label: 提交前确认
      options:
        - label: 这个请求不要求提交密钥、Cookie、私信正文或绕过 X/模型服务限制
          required: true
