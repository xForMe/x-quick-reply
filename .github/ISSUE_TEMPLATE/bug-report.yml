name: 缺陷报告
description: 报告快速回复插件、网关或回填流程的问题
title: "[缺陷] "
body:
  - type: markdown
    attributes:
      value: |
        请先确认使用的是最新代码，并删除内容中的 API 密钥、Cookie、私信正文和完整个人网址。

  - type: input
    id: version
    attributes:
      label: 插件版本
      description: 可在 chrome://extensions 中查看，例如 0.3.0
      placeholder: 0.3.0

  - type: dropdown
    id: area
    attributes:
      label: 问题范围
      options:
        - Chrome 插件加载或面板
        - X 页面读取或会话识别
        - 模型生成或语言
        - 百炼决策
        - 草稿回填
        - 本地网关或配置
        - 其他
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: 复现步骤
      description: 请按顺序描述操作，并说明帖子回复弹窗或私信场景
      placeholder: |
        1. 打开……
        2. 点击……
        3. 看到……
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: 期望结果
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: 实际结果
      description: 请粘贴完整的脱敏错误提示，不要只写“不能用”
    validations:
      required: true

  - type: textarea
    id: diagnostics
    attributes:
      label: 脱敏排查信息
      description: 可粘贴插件“复制排查信息”的结果；不要包含正文、草稿、帖子标识、网址或凭据
      render: json

  - type: textarea
    id: prototype
    attributes:
      label: 修复原型
      description: 提供修复后高保真 HTML 原型路径或可访问链接；若确实不涉及用户可见界面，填写“不适用”并说明原因
      placeholder: |
        路径/链接：doc/<需求标识>/原型/index.html
        覆盖状态：
        评审状态：待评审
    validations:
      required: true

  - type: textarea
    id: technical
    attributes:
      label: 修复技术方案
      description: 提供技术方案路径或可访问链接，说明根因、修改边界、失败停止条件、验证方式和未验证事项；Issue 讨论结论必须回写技术.md
      placeholder: |
        路径/链接：doc/<需求标识>/技术.md
        根因与方案：
        待验证事项：
        评审状态：待评审
    validations:
      required: true

  - type: checkboxes
    id: safety
    attributes:
      label: 提交前确认
      options:
        - label: 我已删除 API 密钥、Cookie、私信正文和其他敏感信息
          required: true
        - label: 我已检查当前分支或版本，并确认问题仍可复现
          required: true
