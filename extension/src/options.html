<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"><title>快速回复设置</title>
  <style>
    body{max-width:680px;margin:40px auto;padding:0 20px;font:15px/1.6 system-ui;color:#17202a}
    label{display:block;margin:18px 0 6px;font-weight:600}
    input,select,textarea{box-sizing:border-box;width:100%;padding:10px;border:1px solid #aab8c2;border-radius:6px;font:inherit}
    textarea{resize:vertical;min-height:260px}button{margin:18px 12px 0 0;padding:9px 16px;cursor:pointer}
    small{display:block;color:#536471}.error{color:#b42318}#save{background:#1d9bf0;color:white;border:1px solid #1d9bf0;border-radius:6px}
    .tabs{display:flex;gap:8px;margin:22px 0 6px}.tab{margin:0;padding:8px 18px;border:1px solid #aab8c2;border-radius:6px 6px 0 0;background:#f3f6f9;cursor:pointer;font-weight:600}.tab.selected{background:#1d9bf0;color:#fff;border-color:#1d9bf0}
  </style>
</head>
<body>
  <div id="app"></div>
  <script src="vendor/react.production.min.js"></script>
  <script src="vendor/react-dom.production.min.js"></script>
  <script type="module" src="options.js"></script>
</body>
</html>
