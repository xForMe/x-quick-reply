<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"><title>快速回复设置</title>
  <style>
    body{max-width:680px;margin:40px auto;padding:0 20px;font:15px/1.6 system-ui;color:#17202a}
    label{display:block;margin:18px 0 6px;font-weight:600}
    input,select,textarea{box-sizing:border-box;width:100%;padding:10px;border:1px solid #aab8c2;border-radius:6px;font:inherit}
    textarea{resize:vertical;min-height:260px}button{margin:18px 12px 0 0;padding:9px 16px;cursor:pointer}
    small{display:block;color:#536471}.error{color:#b42318}#save{background:#1d9bf0;color:white;border:1px solid #1d9bf0;border-radius:6px}
  </style>
</head>
<body>
  <h1>快速回复设置</h1>
  <p>大模型生成候选，阿里云百炼选择合适回复。请先启动本地网关；模型密钥仅在网关配置。</p>
  <label for="gatewayUrl">本地网关 URL</label>
  <input id="gatewayUrl" value="http://127.0.0.1:8787" placeholder="http://127.0.0.1:8787">
  <label for="tone">默认语气</label>
  <select id="tone"><option value="natural">自然</option><option value="concise">简洁</option><option value="polite">礼貌</option><option value="professional">专业</option></select>
  <label for="candidateCount">候选数量（2–5）</label>
  <input id="candidateCount" type="number" min="2" max="5" value="3">
  <label for="replyPrompt">整体回复提示词</label>
  <textarea id="replyPrompt" maxlength="3000" aria-describedby="promptHelp"></textarea>
  <small id="promptHelp">生成和百炼筛选共用。可写语气、偏好的接话方式和不想出现的表达，最多 3000 字符。默认轻松幽默；严肃话题优先得体。不要填写密钥或隐私资料。</small>
  <button id="resetPrompt" type="button">恢复默认提示词</button><small>恢复只修改上方文本，点击“保存”后生效。</small>
  <button id="save" type="button">保存</button><span id="status" role="status"></span>
  <script type="module" src="options.js"></script>
</body>
</html>
